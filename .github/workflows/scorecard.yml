name: OpenSSF Scorecard

on:
  branch_protection_rule:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "30 2 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Keep actionable Scorecard alerts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sarif_path = Path("scorecard-results.sarif")
          filtered_path = Path("scorecard-results.filtered.sarif")
          sarif = json.loads(sarif_path.read_text())
          keep_rule_ids = {
              "Binary-ArtifactsID",
              "Branch-ProtectionID",
              "Dangerous-WorkflowID",
              "Dependency-Update-ToolID",
              "Pinned-DependenciesID",
              "SASTID",
              "Security-PolicyID",
              "Token-PermissionsID",
              "VulnerabilitiesID",
          }

          for run in sarif.get("runs", []):
              tool = run.get("tool", {}).get("driver", {})
              rules = tool.get("rules", [])
              kept_rules = []
              rule_index_map = {}
              for index, rule in enumerate(rules):
                  if rule.get("id") in keep_rule_ids:
                      rule_index_map[index] = len(kept_rules)
                      kept_rules.append(rule)
              tool["rules"] = kept_rules

              kept_results = []
              for result in run.get("results", []):
                  rule_id = result.get("ruleId")
                  if rule_id not in keep_rule_ids:
                      continue
                  old_index = result.get("ruleIndex")
                  if old_index in rule_index_map:
                      result["ruleIndex"] = rule_index_map[old_index]
                  kept_results.append(result)
              run["results"] = kept_results

          filtered_path.write_text(json.dumps(sarif, indent=2) + "\n")
          PY

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: scorecard-results.filtered.sarif
