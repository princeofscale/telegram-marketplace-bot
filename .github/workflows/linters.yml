name: Linting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups --dev

      - name: Check using Ruff
        run: uv run ruff check bot tests admin

      - name: Check using Ruff formatter
        run: uv run ruff format --check bot tests admin

      - name: Compile locales
        run: uv run pybabel compile -d bot/locales

      - name: Run tests
        run: uv run pytest
