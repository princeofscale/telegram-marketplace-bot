name: Linting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --all-groups --dev

      - name: Check using Ruff
        run: uv run ruff check bot tests admin

      - name: Check using Ruff formatter
        run: uv run ruff format --check bot tests admin

      - name: Compile locales
        run: uv run pybabel compile -d bot/locales

      - name: Run tests
        run: uv run pytest
