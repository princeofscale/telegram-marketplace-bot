name: Linting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups --dev

      - name: Check using Ruff
        run: uv run ruff check bot tests admin

      - name: Check using Ruff formatter
        run: uv run ruff format --check bot tests admin

      - name: Compile locales
        run: uv run pybabel compile -d bot/locales

      - name: Run tests
        run: uv run pytest
