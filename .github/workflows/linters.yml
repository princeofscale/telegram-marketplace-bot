name: Linting

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups --dev

      - name: Check using Ruff
        run: uv run ruff check bot tests admin

      - name: Check using Ruff formatter
        run: uv run ruff format --check bot tests admin

      - name: Compile locales
        run: uv run pybabel compile -d bot/locales

      - name: Run tests
        run: uv run pytest
