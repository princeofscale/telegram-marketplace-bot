version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:00"
      timezone: "Europe/Saratov"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      python-runtime:
        dependency-type: "production"
      python-development:
        dependency-type: "development"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:15"
      timezone: "Europe/Saratov"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:30"
      timezone: "Europe/Saratov"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/admin"
    schedule:
      interval: "daily"
      time: "02:45"
      timezone: "Europe/Saratov"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 10
