[project]
name = "telegram-marketplace-bot"
version = "1.0.0"
description = "Simple telegram bot for sell any items"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "princeofscale", email = "princeofscale812@proton.me"},
]
package-mode = false
requires-python = ">=3.12,<4.0"
dependencies = [
    "sqlalchemy>=2.0.51,<3.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "cryptography>=49.0.0,<50.0.0",
]

[project.urls]
homepage = "https://github.com/princeofscale/telegram-marketplace-bot"
repository = "https://github.com/princeofscale/telegram-marketplace-bot"

[dependency-groups]
bot = [
    "aiogram>=3.28.2,<4.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "redis>=5.2.1,<8.0.0",
    "loguru>=0.7.3,<1.0.0",
    "sentry-sdk[loguru]>=2.60.0,<3.0.0",
    "aiohttp[speedups]>=3.13.5,<4.0.0",
    "uvloop>=0.21.0,<1.0.0",
    "babel>=2.17.0,<3.0.0",
    "cachetools>=7.1.1,<8.0.0",
    "orjson>=3.11.9,<4.0.0",
    "alembic>=1.14.1,<2.0.0",
    "prometheus-client>=0.21.1,<1.0.0",
    "lolzteam>=2.0.19,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
]
admin = [
    "gunicorn>=26.0.0,<27.0.0",
    "flask>=3.1.0,<4.0.0",
    "flask-admin>=2.2.0,<3.0.0",
    "flask-security-too>=5.8.1,<6.0.0",
    "flask-caching>=2.4.0,<3.0.0",
    "flask-babel>=4.0.0,<5.0.0",
    "flask-sqlalchemy>=3.1.1,<4.0.0",
    "psycopg2-binary>=2.9.12,<3.0.0",
    "tablib[xlsx]>=3.9.0,<4.0.0",
]
dev = [
    "ruff>=0.15.14,<1.0.0",
    "mypy>=2.1.0,<3.0.0",
    "pre-commit>=4.6.0,<5.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "types-cachetools>=7.0.0.20260503,<8.0.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120
lint.select = ["ALL"]
lint.ignore = ["D", "ANN401", "FIX002", "COM812", "ISC001", "FBT001", "FBT002", "ERA", "ARG005", "PGH003", "A005"]
cache-dir = "/tmp/ruff-cache/"
extend-exclude = ["logs", "configs", "migrations"]

[tool.ruff.lint.isort]
no-lines-before = ["future", "standard-library"]
known-local-folder = ["bot", "admin"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["ANN401", "S101", "S311"]

[tool.mypy]
python_version = "3.10"
files = "bot/*.py"
plugins = ["pydantic.mypy"]
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
show_error_context = true
pretty = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports_for_stubs = true
namespace_packages = true
show_absolute_path = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
